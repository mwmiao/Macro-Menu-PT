# Versioned code URLs (?v=<release>, added at image build) never change content, so they can be
# cached for a year. Anything requested without a version is revalidated every time.
map $arg_v $code_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # The page itself must always be fresh: it's what points at the current release's code.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # The service worker and manifest are fetched by fixed URL, so they're never cached.
    # (Regex locations match in order: keep these before the js/css rule.)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control $code_cache always;
    }

    location ~* \.(svg|png|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
