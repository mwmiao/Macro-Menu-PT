server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Code and data change on each release; let browsers revalidate.
    location ~* \.(js|css|html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|png|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
